
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0, user-scalable=no">

<title>Drag Skeleton Creature</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #0b1118;
  font-family: Arial, sans-serif;
  touch-action: none;
}

#stage {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 12px;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
  background: #f4f7f7;
  border: 2px solid #263039;
  border-radius: 10px;
  touch-action: none;
  cursor: grab;
}

canvas:active {
  cursor: grabbing;
}

#hint {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  color: #fff;
  background: #202a32dd;
  padding: 10px 16px;
  border-radius: 20px;
  font-size: 13px;
  pointer-events: none;
  white-space: nowrap;
}
</style>
</head>

<body>
<div id="stage">
  <canvas id="canvas"></canvas>
</div>

<div id="hint">আঙুল দিয়ে ড্র্যাগ করে মুভ করো</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const hint = document.getElementById("hint");

let W = 0;
let H = 0;
let time = 0;

let creatureX = 0;
let creatureY = 0;

let dragging = false;
let pointerId = null;
let lastX = 0;
let lastY = 0;

const CREATURE_WIDTH = 0.76;
const CREATURE_HEIGHT = 0.43;

function resize() {
  const rect = canvas.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  W = rect.width;
  H = rect.height;

  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  keepInside();
}

window.addEventListener("resize", resize);

// মূল প্রাণীর অবস্থান ও আকৃতি
function spine(u, t) {
  const x = -W * CREATURE_WIDTH / 2
          + u * W * CREATURE_WIDTH;

  const y =
      -Math.sin(u * Math.PI * 1.3) * H * 0.20
      + Math.sin(u * 5 + t * 0.7) * 7
      + Math.sin(u * 8 + t) * 4;

  return { x, y };
}

function line(x1, y1, x2, y2, width = 2) {
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.lineWidth = width;
  ctx.strokeStyle = "#292d2d";
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.stroke();
}

function joint(x, y, radius = 2.5) {
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, Math.PI * 2);
  ctx.fillStyle = "#171b1b";
  ctx.fill();
}

// মেরুদণ্ডের পাশের পাঁজর
function drawRibs(u, t) {
  const p = spine(u, t);
  const before = spine(Math.max(0, u - 0.005), t);
  const after = spine(Math.min(1, u + 0.005), t);

  const dx = after.x - before.x;
  const dy = after.y - before.y;
  const len = Math.hypot(dx, dy) || 1;

  const nx = -dy / len;
  const ny = dx / len;

  const size = Math.min(W, H) * 0.025;

  for (const side of [-1, 1]) {
    const x1 = p.x + nx * size * side;
    const y1 = p.y + ny * size * side;

    const x2 = p.x + nx * size * 1.8 * side + dx * 0.3;
    const y2 = p.y + ny * size * 1.8 * side + dy * 0.3;

    const x3 = p.x + nx * size * 2.1 * side + dx * 0.8;
    const y3 = p.y + ny * size * 2.1 * side + dy * 0.8;

    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.quadraticCurveTo(x1, y1, x2, y2);
    ctx.lineTo(x3, y3);

    ctx.lineWidth = 1.5;
    ctx.strokeStyle = "#303333";
    ctx.stroke();
  }
}

// দুই পাশের কোণাকুণি পা
function drawLeg(u, side, t, index) {
  const p = spine(u, t);
  const scale = Math.min(W, H);

  const sway = Math.sin(t * 2 + index * 1.7) * scale * 0.012;

  const x1 = p.x + sway;
  const y1 = p.y + side * scale * 0.012;

  const x2 = x1 + Math.sin(index * 2.4 + t) * scale * 0.018
                 + scale * 0.018;

  const y2 = y1 + side * scale * 0.045;

  const x3 = x2 - scale * 0.012
                 + Math.sin(t * 2 + index) * scale * 0.008;

  const y3 = y2 + side * scale * 0.035;

  const x4 = x3 + scale * 0.012;
  const y4 = y3 + side * scale * 0.002;

  line(x1, y1, x2, y2, 2);
  line(x2, y2, x3, y3, 2);
  line(x3, y3, x4, y4, 2);

  joint(x2, y2, 2);
  joint(x4, y4, 2.5);
}

// সম্পূর্ণ প্রাণী
function drawCreature(t) {
  const count = 180;

  // মূল মেরুদণ্ড
  ctx.beginPath();

  for (let i = 0; i <= count; i++) {
    const p = spine(i / count, t);

    if (i === 0) ctx.moveTo(p.x, p.y);
    else ctx.lineTo(p.x, p.y);
  }

  ctx.strokeStyle = "#292d2d";
  ctx.lineWidth = 4;
  ctx.stroke();

  // মেরুদণ্ডের হাড়
  for (let i = 0; i <= 52; i++) {
    const u = i / 52;
    const p = spine(u, t);
    const before = spine(Math.max(0, u - 0.004), t);
    const after = spine(Math.min(1, u + 0.004), t);

    const angle = Math.atan2(
      after.y - before.y,
      after.x - before.x
    );

    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(angle);

    ctx.beginPath();
    ctx.ellipse(0, 0, 3, Math.min(W, H) * 0.022,
                0, 0, Math.PI * 2);

    ctx.strokeStyle = "#252a2a";
    ctx.lineWidth = 1.3;
    ctx.stroke();

    ctx.restore();

    if (i < 47 && i % 2 === 0) {
      drawRibs(u, t);
    }
  }

  // পা
  for (let i = 0; i < 13; i++) {
    const u = 0.025 + i * 0.071;

    if (u > 0.94) continue;

    drawLeg(u, -1, t, i);
    drawLeg(u, 1, t, i + 3);
  }

  // মাথা
  const head = spine(0, t);
  joint(head.x, head.y, 4);

  // সরু লেজ
  const tail = spine(1, t);
  line(tail.x, tail.y, tail.x + 12, tail.y - 1, 2);
}

// প্রাণীকে ক্যানভাসের মধ্যে রাখা
function keepInside() {
  if (!W || !H) return;

  const marginX = Math.min(W * 0.06, 35);
  const marginY = Math.min(H * 0.06, 35);

  const halfW = W * CREATURE_WIDTH / 2
              + Math.min(W, H) * 0.06;

  const halfH = H * CREATURE_HEIGHT / 2
              + Math.min(W, H) * 0.04;

  const minX = marginX + halfW - W / 2;
  const maxX = W / 2 - marginX - halfW;

  const minY = marginY + halfH - H / 2;
  const maxY = H / 2 - marginY - halfH;

  creatureX = minX <= maxX
    ? Math.max(minX, Math.min(maxX, creatureX))
    : 0;

  creatureY = minY <= maxY
    ? Math.max(minY, Math.min(maxY, creatureY))
    : 0;
}

// টাচ ও মাউস ড্র্যাগ
canvas.addEventListener("pointerdown", (e) => {
  dragging = true;
  pointerId = e.pointerId;

  const rect = canvas.getBoundingClientRect();

  lastX = e.clientX - rect.left;
  lastY = e.clientY - rect.top;

  canvas.setPointerCapture(e.pointerId);
  hint.textContent = "মুভ করতে ড্র্যাগ করো";
});

canvas.addEventListener("pointermove", (e) => {
  if (!dragging || e.pointerId !== pointerId) return;

  const rect = canvas.getBoundingClientRect();

  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  creatureX += x - lastX;
  creatureY += y - lastY;

  lastX = x;
  lastY = y;

  keepInside();
});

function stopDragging(e) {
  if (e.pointerId !== pointerId) return;

  dragging = false;
  pointerId = null;
  hint.textContent = "আবার ড্র্যাগ করে মুভ করো";
}

canvas.addEventListener("pointerup", stopDragging);
canvas.addEventListener("pointercancel", stopDragging);
canvas.addEventListener("lostpointercapture", () => {
  dragging = false;
  pointerId = null;
});

// অ্যানিমেশন
function animate() {
  ctx.clearRect(0, 0, W, H);

  time += 0.025;

  ctx.save();

  ctx.translate(
    W / 2 + creatureX,
    H / 2 + creatureY
  );

  drawCreature(time);

  ctx.restore();

  requestAnimationFrame(animate);
}

resize();
animate();
</script>
</body>
  </html>

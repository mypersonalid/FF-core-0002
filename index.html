
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Realistic Drag Snake</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #080d12;
  touch-action: none;
}

#stage {
  position: fixed;
  inset: 8px;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
  background: #f4f7f7;
  border: 2px solid #263039;
  border-radius: 9px;
  touch-action: none;
  cursor: grab;
}

canvas:active {
  cursor: grabbing;
}

#info {
  position: fixed;
  bottom: 22px;
  left: 50%;
  transform: translateX(-50%);
  background: #101820e8;
  color: white;
  font: 13px Arial, sans-serif;
  padding: 10px 15px;
  border-radius: 24px;
  white-space: nowrap;
  pointer-events: none;
}
</style>
</head>

<body>
<div id="stage">
  <canvas id="canvas"></canvas>
</div>

<div id="info">আঙুল দিয়ে ড্র্যাগ করে সাপটিকে চালাও</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const info = document.getElementById("info");

let W = 0, H = 0;
let time = 0;
let dragging = false;
let pointerId = null;

const snake = [];
const SEGMENTS = 48;

let target = { x: 0, y: 0 };
let headAngle = 0;
let spacing = 8;
let bodyWidth = 7;
let speed = 3.5;

function resize() {
  const rect = canvas.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  W = rect.width;
  H = rect.height;

  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  spacing = Math.max(5, Math.min(W, H) * 0.012);
  bodyWidth = Math.max(3, Math.min(W, H) * 0.009);
  speed = Math.max(2, Math.min(5, Math.min(W, H) * 0.006));

  initializeSnake();
}

function initializeSnake() {
  snake.length = 0;

  const startX = W * 0.43;
  const startY = H * 0.5;

  for (let i = 0; i < SEGMENTS; i++) {
    snake.push({
      x: startX - i * spacing,
      y: startY,
      angle: 0
    });
  }

  target.x = startX;
  target.y = startY;
  headAngle = 0;
}

// কোণের পার্থক্য মসৃণ করা
function angleDifference(a, b) {
  return Math.atan2(Math.sin(b - a), Math.cos(b - a));
}

function getPointer(e) {
  const rect = canvas.getBoundingClientRect();

  return {
    x: e.clientX - rect.left,
    y: e.clientY - rect.top
  };
}

// আঙুল বা মাউসের অবস্থান
canvas.addEventListener("pointerdown", e => {
  dragging = true;
  pointerId = e.pointerId;
  target = getPointer(e);

  canvas.setPointerCapture(e.pointerId);

  info.textContent = "সাপটি তোমার আঙুল অনুসরণ করছে";
});

canvas.addEventListener("pointermove", e => {
  if (!dragging || e.pointerId !== pointerId) return;
  target = getPointer(e);
});

function stopDrag(e) {
  if (e.pointerId !== pointerId) return;

  dragging = false;
  pointerId = null;

  info.textContent = "আবার ড্র্যাগ করে দিক পরিবর্তন করো";
}

canvas.addEventListener("pointerup", stopDrag);
canvas.addEventListener("pointercancel", stopDrag);

canvas.addEventListener("lostpointercapture", () => {
  dragging = false;
  pointerId = null;
});

// মাথা ও শরীরের মুভমেন্ট
function updateSnake() {
  const head = snake[0];

  if (dragging) {
    const dx = target.x - head.x;
    const dy = target.y - head.y;
    const distance = Math.hypot(dx, dy);

    if (distance > 2) {
      const desiredAngle = Math.atan2(dy, dx);

      headAngle += angleDifference(
        headAngle,
        desiredAngle
      ) * 0.13;

      const step = Math.min(speed, distance * 0.15 + 0.4);

      head.x += Math.cos(headAngle) * step;
      head.y += Math.sin(headAngle) * step;
    }
  }

  head.x = Math.max(5, Math.min(W - 5, head.x));
  head.y = Math.max(5, Math.min(H - 5, head.y));
  head.angle = headAngle;

  // প্রতিটি অংশ তার আগের অংশ অনুসরণ করে
  for (let i = 1; i < snake.length; i++) {
    const prev = snake[i - 1];
    const current = snake[i];

    const dx = current.x - prev.x;
    const dy = current.y - prev.y;
    const distance = Math.hypot(dx, dy) || 1;

    const angle = Math.atan2(dy, dx);

    const desiredX = prev.x + dx / distance * spacing;
    const desiredY = prev.y + dy / distance * spacing;

    current.x += (desiredX - current.x) * 0.48;
    current.y += (desiredY - current.y) * 0.48;

    current.angle = angleDifference(
      current.angle || angle,
      Math.atan2(
        prev.y - current.y,
        prev.x - current.x
      )
    ) * 0.15 + angle * 0.85;
  }
}

// লাইন আঁকা
function drawLine(x1, y1, x2, y2, width = 2) {
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.lineWidth = width;
  ctx.strokeStyle = "#292d2d";
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.stroke();
}

function drawJoint(x, y, r = 2) {
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = "#202525";
  ctx.fill();
}

// সাপের মেরুদণ্ড ও পাঁজর
function drawBody() {
  const len = snake.length;

  // মেরুদণ্ড
  ctx.beginPath();

  snake.forEach((p, i) => {
    if (i === 0) ctx.moveTo(p.x, p.y);
    else ctx.lineTo(p.x, p.y);
  });

  ctx.strokeStyle = "#242929";
  ctx.lineWidth = bodyWidth;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.stroke();

  for (let i = 1; i < len - 1; i++) {
    const p = snake[i];
    const prev = snake[i - 1];
    const next = snake[i + 1];

    const angle = Math.atan2(
      next.y - prev.y,
      next.x - prev.x
    );

    const fade = 1 - i / len;
    const ribLength = spacing * (1.7 + fade * 0.4);

    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(angle);

    // প্রতিটি কশেরুকা
    ctx.beginPath();
    ctx.ellipse(
      0, 0,
      bodyWidth * 0.75,
      spacing * 0.65,
      0, 0, Math.PI * 2
    );
    ctx.fillStyle = "#3b4040";
    ctx.fill();

    // দুই পাশের পাঁজর
    for (const side of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(0, 0);

      ctx.quadraticCurveTo(
        spacing * 0.5,
        side * ribLength * 0.5,
        spacing * 0.8,
        side * ribLength
      );

      ctx.lineWidth = 1.35;
      ctx.strokeStyle = "#303535";
      ctx.stroke();
    }

    ctx.restore();
  }
}

// অনেকগুলো পা পর্যায়ক্রমে নড়বে
function drawLegs() {
  for (let i = 3; i < snake.length - 3; i += 2) {
    const p = snake[i];
    const prev = snake[i - 1];
    const next = snake[i + 1];

    const angle = Math.atan2(
      next.y - prev.y,
      next.x - prev.x
    );

    const phase = time * 5 + i * 0.85;
    const stride = Math.sin(phase) * spacing * 0.65;

    for (const side of [-1, 1]) {
      const nx = -Math.sin(angle) * side;
      const ny = Math.cos(angle) * side;

      const x1 = p.x + nx * bodyWidth * 0.6;
      const y1 = p.y + ny * bodyWidth * 0.6;

      const x2 = x1 + nx * spacing * 1.15
                      + Math.cos(phase) * spacing * 0.3;

      const y2 = y1 + ny * spacing * 1.15
                      + Math.sin(phase) * spacing * 0.3;

      const x3 = x2 + Math.cos(angle) * stride
                      + nx * spacing * 0.45;

      const y3 = y2 + Math.sin(angle) * stride
                      + ny * spacing * 0.45;

      drawLine(x1, y1, x2, y2, 1.5);
      drawLine(x2, y2, x3, y3, 1.5);
      drawJoint(x3, y3, 1.6);
    }
  }
}

// মাথা
function drawHead() {
  const p = snake[0];

  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(headAngle);

  // মাথার আকৃতি
  ctx.beginPath();
  ctx.moveTo(bodyWidth * 2.1, 0);
  ctx.lineTo(-bodyWidth * 0.8, -bodyWidth * 1.1);
  ctx.lineTo(-bodyWidth * 1.4, 0);
  ctx.lineTo(-bodyWidth * 0.8, bodyWidth * 1.1);
  ctx.closePath();

  ctx.fillStyle = "#292e2e";
  ctx.fill();
  ctx.strokeStyle = "#151919";
  ctx.lineWidth = 1.2;
  ctx.stroke();

  // চোখ
  ctx.beginPath();
  ctx.arc(0, -bodyWidth * 0.65, 1.5, 0, Math.PI * 2);
  ctx.arc(0, bodyWidth * 0.65, 1.5, 0, Math.PI * 2);
  ctx.fillStyle = "#f4f7f7";
  ctx.fill();

  ctx.restore();
}

function animate() {
  ctx.clearRect(0, 0, W, H);

  time += 0.025;

  updateSnake();
  drawBody();
  drawLegs();
  drawHead();

  requestAnimationFrame(animate);
}

window.addEventListener("resize", resize);

resize();
animate();
</script>
</body>
 </html>
